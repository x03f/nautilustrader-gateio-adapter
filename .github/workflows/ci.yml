name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Read-only: this job needs the checkout and nothing else. Stated per job so
    # a workflow-level default can never widen it silently.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The whole declared range is exercised, not a subset of it:
      # `requires-python` in pyproject.toml is `>=3.12,<3.15`, so 3.14 is a
      # version users may install on and must therefore be a version CI runs.
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check gateio_nt tests examples

      - name: Format check (ruff format)
        run: ruff format --check gateio_nt tests examples

      # Both invocations, deliberately. `pytest` and `python -m pytest` do not
      # build the same `sys.path`: the module form prepends the working
      # directory, the console script does not. That difference once hid a
      # broken suite for weeks — it passed locally under `python -m pytest` and
      # failed in CI under `pytest` with `ModuleNotFoundError: No module named
      # 'tests'`. `pythonpath = ["."]` in pyproject.toml is the fix; running
      # only one of the two would leave nothing watching that it stays fixed,
      # and CONTRIBUTING.md tells contributors to run either one.
      - name: Run unit tests (bare pytest, the console script)
        run: pytest -q

      - name: Run unit tests (python -m pytest, the module form)
        run: python -m pytest -q

      - name: Import smoke test
        run: |
          python -c "
          import gateio_nt
          from gateio_nt.common.symbols import instrument_id_to_gateio
          from gateio_nt.http.spot import GateioSpotHttpAPI
          from gateio_nt.websocket.public import GateioPublicWebSocket
          print(gateio_nt.__version__, instrument_id_to_gateio('BTC_USDT-PERP.GATE_IO'))
          "

  minimum-platform:
    # `nautilus_trader>=1.230.0,<2` is a claim about the oldest platform the
    # adapter works against, and the matrix above never tests it: pip resolves
    # the newest release every time. Without this job the lower bound is a guess
    # written into the metadata, and a platform API added after 1.230.0 could be
    # used here for months before anyone on the declared minimum found out.
    # Python 3.12 with nautilus_trader 1.230.0 is the floor of the declared
    # support box in both dimensions at once.
    name: Minimum declared platform (nautilus_trader 1.230.0)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Installed after the package, so the resolver cannot quietly upgrade it
      # back: `pip install -e .` pulls the newest platform that satisfies the
      # range, and this pins it back down to the lower bound.
      - name: Pin the platform to the declared lower bound
        run: |
          pip install "nautilus_trader==1.230.0"
          python - <<'PY'
          import nautilus_trader

          assert nautilus_trader.__version__ == "1.230.0", nautilus_trader.__version__
          print("platform pinned to", nautilus_trader.__version__)
          PY

      - name: Run unit tests (bare pytest, the console script)
        run: pytest -q

      - name: Run unit tests (python -m pytest, the module form)
        run: python -m pytest -q

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # A previous build's artifacts must never survive into a release upload:
      # `python -m build` does not clear `dist/`, so a stale wheel from an older
      # version would still be there for `twine upload` to pick up.
      - name: Clean previous build artifacts
        run: rm -rf dist/ build/ *.egg-info

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Check dist holds exactly this version
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          files = sorted(p.name for p in pathlib.Path("dist").iterdir())
          expected = [
              f"gateio_nt_community-{version}-py3-none-any.whl",
              f"gateio_nt_community-{version}.tar.gz",
          ]
          assert files == sorted(expected), f"dist/ holds {files}, expected {sorted(expected)}"
          print("dist/ is clean:", files)
          PY

      # Installing into a clean environment OUTSIDE the source tree is the point
      # of this step: with the checkout on sys.path, every import below would
      # succeed even from a wheel that shipped no sub-packages at all.
      - name: Verify the installed wheel exposes every sub-package
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --upgrade pip
          /tmp/wheelcheck/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheelcheck/bin/python - <<'PY'
          import importlib

          import gateio_nt

          # Every sub-package must be present in the distribution.
          for name in (
              "gateio_nt.common",
              "gateio_nt.common.constants",
              "gateio_nt.common.credentials",
              "gateio_nt.common.enums",
              "gateio_nt.common.errors",
              "gateio_nt.common.parsing",
              "gateio_nt.common.signing",
              "gateio_nt.common.symbols",
              "gateio_nt.http",
              "gateio_nt.http.client",
              "gateio_nt.http.futures",
              "gateio_nt.http.margin",
              "gateio_nt.http.options",
              "gateio_nt.http.spot",
              "gateio_nt.http.wallet",
              "gateio_nt.websocket",
              "gateio_nt.websocket.client",
              "gateio_nt.websocket.private",
              "gateio_nt.websocket.public",
              "gateio_nt.books",
              "gateio_nt.config",
              "gateio_nt.data",
              "gateio_nt.execution",
              "gateio_nt.factories",
              "gateio_nt.instruments",
              "gateio_nt.providers",
          ):
              importlib.import_module(name)

          # Every name the README and docs tell users to import must resolve.
          from gateio_nt import (
              GATEIO,
              GateioDataClient,
              GateioDataClientConfig,
              GateioExecClientConfig,
              GateioExecutionClient,
              GateioFuturesHttpAPI,
              GateioHttpClient,
              GateioInstrumentProvider,
              GateioLiveDataClientFactory,
              GateioLiveExecClientFactory,
              GateioMarginHttpAPI,
              GateioOptionsHttpAPI,
              GateioProductType,
              GateioPublicWebSocket,
              GateioSpotAccountMode,
              GateioSpotHttpAPI,
              GateioWalletHttpAPI,
              instrument_id_to_gateio,
              product_of,
          )

          assert GATEIO == "GATE_IO", GATEIO
          assert instrument_id_to_gateio("BTC_USDT-PERP.GATE_IO") == (
              GateioProductType.PERP,
              "BTC_USDT",
          )
          assert GateioExecClientConfig().environment == "mainnet"
          print("wheel verified:", gateio_nt.__version__, gateio_nt.__file__)
          PY

  examples:
    name: Examples
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      # Importing each example proves it still matches the package API. The
      # examples are not executed here: they need the venue, so running them is
      # a release-checklist step (docs/releasing.md).
      - name: Byte-compile and import every example
        run: |
          python -m compileall -q examples
          python - <<'PY'
          import importlib.util
          import pathlib

          for path in sorted(pathlib.Path("examples").glob("*.py")):
              spec = importlib.util.spec_from_file_location(path.stem, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              assert hasattr(module, "main"), f"{path} defines no main()"
              print("ok:", path)
          PY
