name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check nautilus_gateio tests examples

      - name: Format check (ruff format)
        run: ruff format --check nautilus_gateio tests examples

      - name: Run unit tests
        run: pytest -q

      - name: Import smoke test
        run: python -c "import nautilus_gateio; print(nautilus_gateio.__version__)"

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Verify wheel installs and imports
        run: |
          pip install dist/*.whl
          python -c "import nautilus_gateio; print(nautilus_gateio.__version__)"
