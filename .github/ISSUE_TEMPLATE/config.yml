# Blank issues stay off, so every route into the tracker is one of the forms
# beside this file. That is why a "Question" form exists: the contact link here
# used to point back at the issue list and ask for a `question` label, which a
# person without write access cannot apply — a route that led nowhere.
#
# Discussions are not enabled on this repository (only the owner can enable
# them), so nothing here links to them.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability (do not open an issue)
    url: https://github.com/x03f/nautilustrader-gateio-adapter/security/advisories/new
    about: Report privately through GitHub. SECURITY.md says what a report should and must not contain.
  - name: Something failed and you want to check it is already known
    url: https://github.com/x03f/nautilustrader-gateio-adapter/blob/main/docs/troubleshooting.md
    about: The failures that have actually happened, with cause and fix. Open a bug report if yours is not there.
  - name: What is and is not supported
    url: https://github.com/x03f/nautilustrader-gateio-adapter#feature-support-matrix
    about: The feature matrix and docs/validation.md record which paths have been run against the venue.
